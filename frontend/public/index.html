<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EyeGasto</title>
  <link href="./src/output.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Lacquer&family=Lilita+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png">
  <link rel="manifest" href="./favicon/site.webmanifest">
  <link rel="stylesheet" href="./animations/styles.css">

</head>

<body class="bg-[#0d1b3e] overflow-x-hidden flex min-h-screen flex-col relative">

  <div class="bubble bubble-1"></div>
  <div class="bubble bubble-2"></div>
  <div class="bubble bubble-3"></div>
  <div class="bubble bubble-4"></div>
  <div class="bubble bubble-5"></div>

  <div class="star star-1"></div>
  <div class="star star-2"></div>
  <div class="star star-3"></div>
  <div class="star star-4"></div>
  <div class="star star-5"></div>
  <div class="star star-6"></div>
  <div class="star star-7"></div>

   <!--Flaating Navbar-->

 <div class=" fixed bottom-5 right-4 left-4 w-[90%] px-1 py-3  bg-white rounded-[10px] z-10 flex justify-evenly items-center">
    <button class="active nav-btn flex flex-col text-gray-400 items-center gap-1" data-section="home" data-title="Home">
    <i class="fa-solid fa-house text-lg"></i>
    <span class="text-[10px] font-['DM_Sans'] font-bold">Home</span>
   </button>
  <button class=" nav-btn flex flex-col items-center gap-1 text-gray-400" data-section="expenses" data-title="Expenses">
    <i class="fa-solid fa-receipt text-lg"></i>
    <span class="text-[10px] font-['DM_Sans']">Expenses</span>
  </button>
  
<div class="flex flex-col items-center -mt-8">
  <div class="bg-white rounded-full p-1.5 ">
    <button class="w-14 h-14 rounded-full bg-[#23736F] flex items-center flex-col relative shadow-lg">
      <img 
        src="images/gastoo-assets/gastoo_head_nav.png" 
        alt="Gastoo's head navigation"
      >
      <i class="absolute bottom-0.5 fa-solid fa-plus text-white text-[10px]"></i>
    </button>
  </div>
</div>
  <button class=" nav-btn flex flex-col items-center gap-1 text-gray-400" data-section="analytics" data-title="Analytics">
    <i class="fa-solid fa-chart-pie text-lg"></i>
    <span class="text-[10px] font-['DM_Sans']">Analytics</span>
  </button>

  <button class="nav-btn  flex flex-col items-center gap-1 text-gray-400" data-section="profile" data-title="Profile">
    <i class="fa-solid fa-user text-lg"></i>
    <span class="text-[10px] font-['DM_Sans']">Profile</span>
  </button>
 </div>

    <div class="home-navbar flex justify-between w-full p-3">
      <div class="flex items-center gap-3">
        <i class = "fa-solid fa-bars text-white text-2xl"></i>
        <p class="nav-title text-white font-['DM_Sans']"></p>
      </div>
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-bell text-white"></i>
        <img src="images/user.png" class="rounded-2xl w-8 h-8" alt="User default avatar"></div>
      </div>
   
    <div class="hidden section home-section hidden">
  
    <div class="w-full mt-5">
      <div class="greeting text-white text-m font-['DM_Sans'] flex gap-1 justify-end w-full px-2"></div>
      <div class="bg-custom w-full h-30 flex items-center justify-between px-2">
      <div class="gastoo-container  w-[110px] h-[110px] flex-none shrink-0">
      </div>

      <div class="relative w-full h-20">
         <div class="bg-white absolute bottom-4 -left-0.5 h-5 w-5 rotate-45 z-0"> </div>
       <div class="font-['DM_Sans'] bg-white flex-1 w-full h-full rounded-lg relative z-10 shadow-2xl p-2">
        <div class="font-bold font-['DM_Sans ] text-[#23736F] ">I'm Gastoo!</div>
        <div class="gastoo-greet font-['DM_Sans ] text-black text-sm" data-type="home"></div>
      </div>
      <div>
        
      </div>
    </div>
    </div>

    <div class="xl:col-span-4 flex justify-center gap-8 flex-wrap">
      
      <div class=" reveal-3 mt-20 w-full relative flex items-center justify-center bg-gradient-to-b from-white from-0% to-[#45E7EE] to-100% pt-22 pb-5 rounded-[20px] px-4">

        <div class="grid grid-cols-2 gap-2">
          <div class="expenses-category-container bg-white shadow-md rounded-2xl p-1">
            <h1 class="text-black font-['DM_Sans'] font-bold text-[12px] text-center">EXPENSES BY CATEGORY</h1>

            <div class="chart-card-container">
           
              <canvas id="expensesChart">

              </canvas>
            </div>

            <div id="expensesLegend"></div>
          </div>

          <div class="amounts-container flex flex-col items-center justify-evenly">
            
            <div class="budget-container bg-white shadow-md rounded-2xl w-full">

              <div class="w-full p-3">

              <h1 class="font-['DM_Sans'] text-black font-bold text-[12px] tracking-widest opacity-[50%]">TODAY'S BUDGET</h1>
              <div class="budgetAmounts font-bold flex items-center font-['DM_Sans']">
                
              </div>
              <div class="bar-track bg-[#e5e7eb] rounded-lg h-[8px] w-full">
                <div class="bar-fill h-full rounded-lg bg-[#22c55e] w-[0%] transition-all duration-700 ease-in" id="budgetBar"></div>
              </div>
            </div>

           </div>

            <div class="total-expenses-container bg-white shadow-md rounded-2xl p-3 w-full">
              <h1 class="font-['DM_Sans'] text-black font-bold text-[12px]  tracking-widest opacity-[50%]">TOTAL EXPENSES</h1>
              <p class="total-expenses font-bold text-2xl text-[#079F9F] font-['DM_Sans']"></p>
            </div>
          </div>

         <div class="expenses-super-container col-span-2 w-full">
              <div class="expenses-header flex justify-between">
                <h1 class="font-bold text-black opacity-[50%] tracking-widest">YOUR EXPENSES</h1>
                <a href="">See All</a>
              </div>
            
            <div class="expenses-main-container bg-[#EBF8F7]/65 shadow-md rounded-xl p-2 h-[300px] overflow-y-auto">
              <div class="date-today flex justify-between font-['DM_Sans']">

              </div>
              <div class="expenses-container">
                
              </div>
            </div>

            </div>

        </div>
        
        <!-- Savings Vault Card -->
      <div class="reveal-2 outer-card max-w-[550px] w-[90%] xl:w-[500px] p-3 absolute -top-15 ">
       

          <i class="fa-solid fa-receipt js-receipt-btn text-gray-500 text-xl absolute top-2 right-2 cursor-pointer"></i>
          <div class="flex items-start justify-evenly w-full text-white">
           
          <div class="flex flex-col">
            <h1 class="font-['DM_Sans'] font-bold w-full text-white text-sm sm:text-base">Total Saved Money</h1>
            <p
              class="savings-balance font-['DM_Sans'] font-bold text-[25px]  md:text-3xl w-[90%] truncate"> 
            </p>
        
          </div>
    
          <div class="flex items-center justify-center w-[40%] sm:w[100%]">
        <img class=" w-full min-w-[130px] max-w-[150px]" src="./images/money-bag.png" alt="Money bag big logo">
          </div>
        </div>
      </div>

      </div>
    </div>
    
    <!-- Transactions Modal -->
    <div
      class=" transactions-container w-full fixed inset-0 bg-black/50 z-50 flex flex-col items-center hidden
              justify-center">
              <div class="js-close-transactions absolute top-5 right-5 text-white text-xl">
                <i class="fa-solid fa-x cursor-pointer"></i>
              </div>
              <div class="outer-card rounded-md p-3">
                <div class="bg-white w-full flex flex-col max-h-[50vh] rounded-md p-3">
                  <div>
                    <h1 class="text-center font-bold pb-3 sm:text-base">Transactions</h1>
                  </div>
                  <div class = "flex flex-row justify-between">
                    <h1 class = "date-today"></h1>
                    <select name="filter-transactions"          id="filter-transactions">
                      <option value="today">Today</option>
                      <option value="last7">Last 7 Days</option>
                      <option value="alltime">All Time</option>
                    </select>
                  </div>
                  <div class="t-date-container h-[30px] font-['DM_Sans'] pb-3 px-3 pt-1">
                  </div>
                  <div class="w-full grid grid-cols-4 text-sm sm:text-base">
                    <h1 class="text-center font-bold">Amount</h1>
                    <h1 class="text-center font-bold">Description</h1>
                    <h1 class="text-center font-bold">Type</h1>
                    <h1 class="text-center font-bold">Date</h1>
                  </div>
                  <div class="receipts-container w-full grid grid-rows-auto gap-1 text-sm overflow-y-auto sm:text-base">
                  </div>
                </div>
              </div>
          </div>

          <!-- Add Expense Modal -->
          <div
            class="add-expense-option-container w-full fixed inset-0 bg-black/50 z-50 flex hidden items-center justify-center">
            <div class="js-close-add-expense absolute top-5 right-5 text-white text-xl cursor-pointer">
              <i class="fa-solid fa-x"></i>
            </div>
            <div class="outer-card max-w-[550px] p-4">
              <div class="flex items-center gap-2 pb-1">
                <img src="images/add-expense.png" alt="Add expense logo" class="w-9">
                <h1 class="font-['Lilita_One'] text-white text-xl text-outline-black">Add Expense</h1>
              </div>
              <div class="inner-card flex flex-col gap-3 w-full items-center sm:flex-row p-3">

                <div class="w-full flex flex-row gap-2 flex-wrap max-w-[350px] sm:w-[800px]">
                  <div class="relative w-[50%]">
                    <input type="text" id="expense-description" placeholder="Description" class="peer input-cozy">
                    <label for="expense-description" class="label-cozy">Description</label>
                  </div>
                  <div class="relative w-[45%]">
                    <input type="number" id="expense-amount" placeholder="Amount" class="peer input-cozy" min="0">
                    <label for="expense-amount" class="label-cozy">Amount</label>
                  </div>
                  <select name="category" id="category" aria-placeholder="Category"
                    class="w-full p-2 text-sm border-2 rounded-xl bg-white text-black sm:text-base">
                    <option value="" selected disabled hidden>Category</option>
                    <option value="1">Foods</option>
                    <option value="2">Transport</option>
                    <option value="3">Shopping</option>
                    <option value="4">Bills</option>
                    <option value="5">Health</option>
                    <option value="6">Entertainment</option>
                    <option value="7">Education</option>
                    <option value="8">Savings</option>
                    <option value="9">Debt</option>
                    <option value="10">Others</option>
                  </select>
                </div>

                <div class="flex gap-3 items-center justify-center w-full">
                  <button id="js-add-expense"
                    class="eye-gasto-button text-white flex justify-center items-center px-7 py-3 gap-1 text-xs rounded-2xl text-outline-black-38 drop-shadow-[0_2px_2px_rgba(0,0,0,0.56)] cursor-pointer sm:text-base">
                    Add Expense
                  </button>
                </div>

              </div>
            </div>
          </div>

          <!-- Edit Expense Option (Initially Hidden) -->
          <div
            class="edit-expense-option-container w-full fixed inset-0 bg-black/50 z-50 flex hidden items-center justify-center">
            <div class="js-close-edit-expense absolute top-5 right-5 text-white text-xl cursor-pointer">
              <i class="fa-solid fa-x"></i>
            </div>
            <div class="outer-card max-w-[550px] p-4">
              <div class="flex items-center gap-2 pb-1">
                <img src="images/add-expense.png" alt="Add expense logo" class="w-9">
                <h1 class="font-['Lilita_One'] text-white text-xl text-outline-black">Edit Expense</h1>
              </div>
              <div class="inner-card flex flex-col gap-3 w-full items-center sm:flex-row p-3">

                <div class="w-full flex flex-row gap-2 flex-wrap max-w-[350px] sm:w-[800px]">
                  <div class="relative w-[50%]">
                    <input type="text" id="edit-expense-description" placeholder="Description" class="peer input-cozy">
                    <label for="edit-expense-description" class="label-cozy">Description</label>
                  </div>
                  <div class="relative w-[45%]">
                    <input type="number" id="edit-expense-amount" placeholder="Amount" class="peer input-cozy" min="0">
                    <label for="edit-expense-amount" class="label-cozy">Amount</label>
                  </div>
                  <select name="category" id="edit-category" aria-placeholder="Category"
                    class="w-full p-2 text-sm border-2 rounded-xl bg-white text-black sm:text-base">
                    <option value="" selected disabled hidden>Category</option>
                    <option value="1">Foods</option>
                    <option value="2">Transport</option>
                    <option value="3">Shopping</option>
                    <option value="4">Bills</option>
                    <option value="5">Health</option>
                    <option value="6">Entertainment</option>
                    <option value="7">Education</option>
                    <option value="8">Savings</option>
                    <option value="9">Debt</option>
                    <option value="10">Others</option>
                  </select>
                </div>

                <button id="js-save-edit"
                  class=" bg-green-500 text-white flex justify-center items-center px-7 py-3 gap-1 text-xs rounded-2xl drop-shadow-[0_2px_2px_rgba(0,0,0,0.56)] cursor-pointer sm:text-base">Save
                  Edit</button>
              </div>

            </div>
          </div>
        </div>

      </div>

    <div class="hidden section expenses-section">

      <div class=" flex flex-col gap-3">
        <h1 class="text-white font-bold font-['DM_Sans'] text text-2xl text-center">Expenses</h1>
        <div class="bg-custom w-full h-30 flex items-center justify-between px-2">
         <div class="gastoo-container  w-[110px] h-[110px] flex-none shrink-0">
        </div>

        <div class="relative w-full h-20">
         <div class="bg-white absolute bottom-4 -left-0.5 h-5 w-5 rotate-45 z-0"> </div>
       <div class="font-['DM_Sans'] bg-white flex-1 w-full h-full rounded-lg relative z-10 shadow-2xl p-2">
        <div class="font-bold font-['DM_Sans ] text-[#23736F] ">I'm Gastoo!</div>
        <div class="gastoo-greet font-['DM_Sans ] text-black text-sm" data-type="expenses"></div>
      </div>
      <div>
        
      </div>
      </div>
      </div>
    
    </div>

      <div id="notif-container"></div>


      <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
      <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
      <script src="scripts/main.js" type="module"></script>
</body>

</html>
